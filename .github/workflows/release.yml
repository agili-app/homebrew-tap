name: Publish native release

on:
  workflow_dispatch:
    inputs:
      product:
        description: Product registered in scripts/release/common.py
        type: string
        required: true
      version:
        description: Optional X.Y.Z; empty uses bump
        type: string
      bump:
        type: choice
        options: [patch, minor, major]
        default: patch
      channel:
        type: choice
        options: [preview, stable]
        default: preview
      rebuild:
        description: Same stable version with a fresh immutable build; stable only
        type: boolean
        default: false
      source_ref:
        type: string
        default: main

# The lock includes plan, every native build, mutable feeds, Homebrew/Scoop, and webhook.
concurrency:
  group: native-release-${{ inputs.product }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_RUN_ID: ${{ github.run_id }}

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'agili-app/homebrew-tap'
    environment: release
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      repo: ${{ steps.plan.outputs.repo }}
      matrix: ${{ steps.plan.outputs.matrix }}
      credentials: ${{ steps.plan.outputs.credentials }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/release/requirements.lock
      - run: python -m pip install --require-hashes -r scripts/release/requirements.lock
      - id: plan
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BUCKET: ${{ vars.R2_PUBLIC_BUCKET }}
          R2_PRIVATE_BUCKET: ${{ vars.R2_PRIVATE_BUCKET }}
          SOURCE_TOKEN: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
          RELEASE_REBUILD: ${{ inputs.rebuild && 'true' || 'false' }}
          PRODUCT: ${{ inputs.product }}
        run: python scripts/release/publisher.py plan --product "$PRODUCT"

  build:
    needs: plan
    environment: release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/release/requirements.lock
      - run: python -m pip install --require-hashes -r scripts/release/requirements.lock
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.plan.outputs.repo }}
          ref: ${{ needs.plan.outputs.sha }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: .private-source
          persist-credentials: false
      - name: Set up pinned source build tools and public caches
        uses: ./.private-source/scripts/release/setup
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
      - name: Import ephemeral Apple credentials
        id: apple
        if: matrix.platform == 'macos'
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets[fromJSON(needs.plan.outputs.credentials).developerIdP12Base64] }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets[fromJSON(needs.plan.outputs.credentials).developerIdP12Password] }}
          MACOS_SIGNING_IDENTITY: ${{ vars[fromJSON(needs.plan.outputs.credentials).signingIdentity] }}
          APPLE_TEAM_ID: ${{ vars[fromJSON(needs.plan.outputs.credentials).appleTeamId] }}
          NOTARY_APPLE_ID: ${{ secrets[fromJSON(needs.plan.outputs.credentials).notaryAppleId] }}
          NOTARY_APP_SPECIFIC_PASSWORD: ${{ secrets[fromJSON(needs.plan.outputs.credentials).notaryPassword] }}
        run: python scripts/release/apple_signing.py prepare
      # No public cache or CI artifact contains private source/target/GOCACHE.
      - name: Build and stage signed packages in private R2
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BUCKET: ${{ vars.R2_PUBLIC_BUCKET }}
          R2_PRIVATE_BUCKET: ${{ vars.R2_PRIVATE_BUCKET }}
          PRODUCT: ${{ inputs.product }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          RELEASE_UPDATE_PUBLIC_KEY: ${{ vars[fromJSON(needs.plan.outputs.credentials).updatePublicKey] }}
          RELEASE_UPDATE_PRIVATE_KEY: ${{ secrets[fromJSON(needs.plan.outputs.credentials).updatePrivateKey] }}
          RELEASE_PROFILE_APP_BASE64: ${{ secrets[fromJSON(needs.plan.outputs.credentials).profileApp] }}
          RELEASE_PROFILE_PREVIEW_BASE64: ${{ secrets[fromJSON(needs.plan.outputs.credentials).profilePreview] }}
          MACOS_SIGNING_IDENTITY: ${{ vars[fromJSON(needs.plan.outputs.credentials).signingIdentity] }}
          DEVELOPMENT_TEAM: ${{ vars[fromJSON(needs.plan.outputs.credentials).appleTeamId] }}
        run: python scripts/release/publisher.py build --product "$PRODUCT" --platform "$PLATFORM" --arch "$ARCH"
      - name: Remove ephemeral Apple credentials
        if: always() && steps.apple.outcome != 'skipped' && steps.apple.outcome != ''
        run: python scripts/release/apple_signing.py cleanup

  publish:
    needs: [plan, build]
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/release/requirements.lock
      - run: python -m pip install --require-hashes -r scripts/release/requirements.lock
      - name: Verify all packages and advance native feeds
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BUCKET: ${{ vars.R2_PUBLIC_BUCKET }}
          R2_PRIVATE_BUCKET: ${{ vars.R2_PRIVATE_BUCKET }}
          PRODUCT: ${{ inputs.product }}
        run: python scripts/release/publisher.py publish --product "$PRODUCT"
      - name: Sync stable Homebrew and Scoop manifests
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BUCKET: ${{ vars.R2_PUBLIC_BUCKET }}
          R2_PRIVATE_BUCKET: ${{ vars.R2_PRIVATE_BUCKET }}
          CHANNEL: ${{ inputs.channel }}
          PRODUCT: ${{ inputs.product }}
        run: |
          if [ "$CHANNEL" = stable ]; then
            python scripts/release/sync_cask.py --product "$PRODUCT"
          fi
      - name: Preserve product deployment webhook after Homebrew and Scoop success
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BUCKET: ${{ vars.R2_PUBLIC_BUCKET }}
          R2_PRIVATE_BUCKET: ${{ vars.R2_PRIVATE_BUCKET }}
          PRODUCT: ${{ inputs.product }}
          DEPLOY_WEBHOOK_URL: ${{ vars[fromJSON(needs.plan.outputs.credentials).deployWebhookUrl] }}
        run: python scripts/release/publisher.py webhook --product "$PRODUCT"

  cleanup:
    needs: [plan, build, publish]
    if: always() && needs.plan.result == 'success' && github.event_name == 'workflow_dispatch' && github.repository == 'agili-app/homebrew-tap'
    environment: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/release/requirements.lock
      - run: python -m pip install --require-hashes -r scripts/release/requirements.lock
      - name: Delete temporary private packages and diagnostics
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BUCKET: ${{ vars.R2_PUBLIC_BUCKET }}
          R2_PRIVATE_BUCKET: ${{ vars.R2_PRIVATE_BUCKET }}
          PRODUCT: ${{ inputs.product }}
        run: python scripts/release/publisher.py cleanup --product "$PRODUCT"
