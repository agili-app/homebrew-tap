name: Publish native release

on:
  workflow_dispatch:
    inputs:
      product:
        type: choice
        options: [tinymd, metrix-bar]
        required: true
      version:
        description: Optional X.Y.Z; empty uses bump
        type: string
      bump:
        type: choice
        options: [patch, minor, major]
        default: patch
      channel:
        type: choice
        options: [preview, stable]
        default: preview
      source_ref:
        type: string
        default: main
      resume_run:
        description: Optional run ID to reuse failed signed stage
        type: string
        required: false

# The lock includes plan, every native build, mutable feeds, Cask, and webhook.
concurrency:
  group: native-release-${{ inputs.product }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_RUN_ID: ${{ inputs.resume_run || github.run_id }}
  RELEASE_RESUME_RUN: ${{ inputs.resume_run }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_PUBLIC_BUCKET: ${{ vars.R2_PUBLIC_BUCKET }}
  R2_PRIVATE_BUCKET: ${{ vars.R2_PRIVATE_BUCKET }}

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'agili-app/homebrew-tap'
    environment: release
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      repo: ${{ steps.plan.outputs.repo }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/release/requirements.lock
      - run: python -m pip install --require-hashes -r scripts/release/requirements.lock
      - id: plan
        env:
          SOURCE_TOKEN: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
          PRODUCT: ${{ inputs.product }}
        run: python scripts/release/publisher.py plan --product "$PRODUCT"

  build:
    needs: plan
    environment: release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/release/requirements.lock
      - run: python -m pip install --require-hashes -r scripts/release/requirements.lock
      - name: Check reusable signed stage
        id: stage
        env:
          PRODUCT: ${{ inputs.product }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: python scripts/release/publisher.py check-stage --product "$PRODUCT" --platform "$PLATFORM" --arch "$ARCH"
      - if: steps.stage.outputs.needs-build == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ needs.plan.outputs.repo }}
          ref: ${{ needs.plan.outputs.sha }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: .private-source
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: steps.stage.outputs.needs-build == 'true' && inputs.product == 'metrix-bar'
        with:
          go-version-file: .private-source/go.mod
          cache: false
      - name: Check public dependency cache boundary
        if: steps.stage.outputs.needs-build == 'true'
        env:
          PRODUCT: ${{ inputs.product }}
        run: python scripts/release/cache_guard.py "$PRODUCT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: steps.stage.outputs.needs-build == 'true' && inputs.product == 'metrix-bar'
        with:
          path: ${{ runner.temp }}/agili-public-gomod
          key: public-gomod-${{ runner.os }}-${{ runner.arch }}-${{ matrix.arch }}-${{ hashFiles('.private-source/go.mod', '.private-source/go.sum') }}
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: steps.stage.outputs.needs-build == 'true' && inputs.product == 'tinymd'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
          key: public-cargo-${{ runner.os }}-${{ runner.arch }}-${{ matrix.arch }}-${{ hashFiles('.private-source/Cargo.lock', '.private-source/rust-toolchain.toml') }}
      - name: Read pinned TinyMD Rust toolchain
        id: rust
        if: steps.stage.outputs.needs-build == 'true' && inputs.product == 'tinymd'
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: python scripts/release/bootstrap.py rust-toolchain
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # reviewed master
        if: steps.stage.outputs.needs-build == 'true' && inputs.product == 'tinymd'
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: ${{ steps.rust.outputs.targets }}
      - name: Bootstrap pinned TinyMD public tools
        if: steps.stage.outputs.needs-build == 'true' && inputs.product == 'tinymd'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: python scripts/release/bootstrap.py "$PLATFORM"
      - name: Import ephemeral Apple credentials
        id: apple
        if: steps.stage.outputs.needs-build == 'true' && matrix.platform == 'macos'
        env:
          PRODUCT: ${{ inputs.product }}
          DEVELOPER_ID_P12_BASE64: ${{ inputs.product == 'tinymd' && secrets.TINYMD_DEVELOPER_ID_P12_BASE64 || secrets.METRIX_DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ inputs.product == 'tinymd' && secrets.TINYMD_DEVELOPER_ID_P12_PASSWORD || secrets.METRIX_DEVELOPER_ID_P12_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ inputs.product == 'tinymd' && vars.TINYMD_SIGNING_IDENTITY || vars.METRIX_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_SPECIFIC_PASSWORD: ${{ secrets.NOTARY_APP_SPECIFIC_PASSWORD }}
          PROVISIONING_PROFILE_APP_BASE64: ${{ inputs.product == 'tinymd' && secrets.PROVISIONING_PROFILE_APP_BASE64 || '' }}
          PROVISIONING_PROFILE_PREVIEW_BASE64: ${{ inputs.product == 'tinymd' && secrets.PROVISIONING_PROFILE_PREVIEW_BASE64 || '' }}
        run: python scripts/release/apple_signing.py prepare "$PRODUCT"
      # No public cache or CI artifact contains private source/target/GOCACHE.
      - name: Build and retain signed packages in private R2
        if: steps.stage.outputs.needs-build == 'true'
        env:
          PRODUCT: ${{ inputs.product }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          TINYMD_UPDATE_PUBLIC_KEY: ${{ inputs.product == 'tinymd' && vars.TINYMD_UPDATE_PUBLIC_KEY || '' }}
          METRIX_UPDATE_PUBLIC_KEY: ${{ inputs.product == 'metrix-bar' && vars.METRIX_UPDATE_PUBLIC_KEY || '' }}
          TINYMD_UPDATE_PRIVATE_KEY: ${{ inputs.product == 'tinymd' && secrets.TINYMD_UPDATE_PRIVATE_KEY || '' }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ inputs.product == 'metrix-bar' && secrets.METRIX_UPDATE_PRIVATE_KEY || '' }}
          MACOS_SIGNING_IDENTITY: ${{ inputs.product == 'tinymd' && vars.TINYMD_SIGNING_IDENTITY || vars.METRIX_SIGNING_IDENTITY }}
          DEVELOPMENT_TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: python scripts/release/publisher.py build --product "$PRODUCT" --platform "$PLATFORM" --arch "$ARCH"
      - name: Remove ephemeral Apple credentials
        if: always() && steps.apple.outcome != 'skipped' && steps.apple.outcome != ''
        run: python scripts/release/apple_signing.py cleanup

  publish:
    needs: [plan, build]
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/release/requirements.lock
      - run: python -m pip install --require-hashes -r scripts/release/requirements.lock
      - name: Verify all packages and advance native feeds
        env:
          PRODUCT: ${{ inputs.product }}
        run: python scripts/release/publisher.py publish --product "$PRODUCT"
      - name: Sync stable Homebrew Cask
        env:
          CHANNEL: ${{ inputs.channel }}
          PRODUCT: ${{ inputs.product }}
        run: |
          if [ "$CHANNEL" = stable ]; then
            python scripts/release/sync_cask.py --product "$PRODUCT"
          fi
      - name: Preserve product deployment webhook after Cask success
        env:
          PRODUCT: ${{ inputs.product }}
          DEPLOY_WEBHOOK_URL: ${{ inputs.product == 'tinymd' && vars.TINYMD_DEPLOY_WEBHOOK_URL || vars.METRIX_DEPLOY_WEBHOOK_URL }}
        run: python scripts/release/publisher.py webhook --product "$PRODUCT"
